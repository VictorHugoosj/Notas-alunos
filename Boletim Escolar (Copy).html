<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boletim Escolar (Copy)</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e8eef3;--card:#fff;--ink:#14213d;--muted:#5b6b7f;--line:#c7d2de;--accent:#1d4ed8;--accent-ink:#fff;
  --err-bg:#fde8e8;--err:#9b1c1c;
  --ok-bg:#dcf5e7;--ok:#17603a;--rec-bg:#fdf1c7;--rec:#7a5200;--rep-bg:#fde8e8;--rep:#9b1c1c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1722;--card:#18222f;--ink:#e6edf5;--muted:#9aa9bb;--line:#2c3b4e;--accent:#6ea0ff;--accent-ink:#0f1722;
  --err-bg:#3a1b1d;--err:#ffb3b3;--ok-bg:#12331f;--ok:#8fe3b2;--rec-bg:#3a2f0f;--rec:#f3d37a;--rep-bg:#3a1b1d;--rep:#ffb3b3;}}
:root[data-theme="dark"]{
  --bg:#0f1722;--card:#18222f;--ink:#e6edf5;--muted:#9aa9bb;--line:#2c3b4e;--accent:#6ea0ff;--accent-ink:#0f1722;
  --err-bg:#3a1b1d;--err:#ffb3b3;--ok-bg:#12331f;--ok:#8fe3b2;--rec-bg:#3a2f0f;--rec:#f3d37a;--rep-bg:#3a1b1d;--rep:#ffb3b3;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;
  font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
.card{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{margin:0 0 20px;color:var(--muted)}
label{display:block;margin:16px 0 6px;font-weight:bold}
input{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[aria-invalid="true"]{border-color:var(--err)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
button{width:100%;margin-top:24px;padding:12px;font:inherit;font-weight:bold;color:var(--accent-ink);background:var(--accent);border:0;border-radius:6px;cursor:pointer}
button.link{width:auto;margin:20px 0 0;padding:0;color:var(--accent);background:none;text-decoration:underline}
.alerta{margin-bottom:4px;padding:10px 12px;color:var(--err);background:var(--err-bg);border-left:4px solid var(--err);border-radius:4px}
dl{margin:20px 0 0}
dt{margin-top:16px;font-size:.9rem;color:var(--muted)}
dd{margin:4px 0 0;font-size:1.25rem;font-weight:bold;overflow-wrap:anywhere}
.selo{display:inline-block;padding:3px 14px;border-radius:999px;font-size:1rem}
.aprovado{background:var(--ok-bg);color:var(--ok)}.recuperacao{background:var(--rec-bg);color:var(--rec)}.reprovado{background:var(--rep-bg);color:var(--rep)}
.barras{display:flex;align-items:flex-end;gap:12px;height:120px;margin:24px 6px 4px;border-bottom:1px solid var(--line);position:relative}
.barras::after{content:"";position:absolute;left:0;right:0;bottom:70%;border-top:1px dashed var(--muted)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.col i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;font-style:normal}
.col b{font-size:.8rem;margin-bottom:2px}
.eixo{display:flex;gap:12px;margin:0 6px;font-size:.8rem;color:var(--muted)}
.eixo span{flex:1;text-align:center}
.legenda{margin:6px 6px 0;font-size:.8rem;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">

  <section id="tela-form">
    <h1>Boletim Escolar</h1>
    <p class="sub">Informe o aluno e as notas dos quatro bimestres.</p>
    <div id="erro" class="alerta" role="alert" hidden></div>
    <form id="form" novalidate>
      <label for="nome">Nome do aluno</label>
      <input type="text" id="nome" maxlength="100" autocomplete="off">
      <div class="grade">
        <div><label for="n0">1º bimestre</label><input type="text" id="n0" inputmode="decimal" autocomplete="off"></div>
        <div><label for="n1">2º bimestre</label><input type="text" id="n1" inputmode="decimal" autocomplete="off"></div>
        <div><label for="n2">3º bimestre</label><input type="text" id="n2" inputmode="decimal" autocomplete="off"></div>
        <div><label for="n3">4º bimestre</label><input type="text" id="n3" inputmode="decimal" autocomplete="off"></div>
      </div>
      <button type="submit">Calcular média</button>
    </form>
  </section>

  <section id="tela-resultado" hidden>
    <h1>Boletim</h1>
    <dl>
      <dt>Aluno</dt><dd id="r-nome"></dd>
      <dt>Média anual</dt><dd id="r-media"></dd>
      <dt>Situação</dt><dd><span id="r-situacao" class="selo"></span></dd>
    </dl>
    <div class="barras" id="r-barras" aria-hidden="true"></div>
    <div class="eixo" aria-hidden="true"><span>1º</span><span>2º</span><span>3º</span><span>4º</span></div>
    <p class="legenda">A linha tracejada marca a média 7, necessária para aprovação.</p>
    <button type="button" id="voltar" class="link">Cadastrar outro aluno</button>
  </section>

</main>

<script>
/* ============ DOMÍNIO ============
   Atributos privados, getters, setters com validação, média e regra de situação.
   Não conhece HTML nem formulário. */
class Aluno {
  #nome; #notas = [];

  constructor(nome, notas) {
    this.setNome(nome);
    this.setNotas(notas);
  }

  getNome() { return this.#nome; }
  getNotas() { return [...this.#notas]; }
  getMedia() { return this.#notas.reduce((a, b) => a + b, 0) / this.#notas.length; }

  setNome(nome) {
    nome = String(nome ?? "").trim();
    if (nome === "") throw new Error("Informe o nome do aluno.");
    if (nome.length < 2 || nome.length > 100)
      throw new Error("O nome deve ter entre 2 e 100 caracteres.");
    this.#nome = nome;
  }

  setNotas(notas) {
    this.#notas = notas.map((n, i) => {
      const b = `${i + 1}º bimestre`;
      n = String(n ?? "").trim().replace(",", ".");
      if (n === "") throw new Error(`Informe a nota do ${b}.`);
      if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(n)) throw new Error(`A nota do ${b} deve ser um número.`);
      const v = parseFloat(n);
      if (v < 0 || v > 10) throw new Error(`A nota do ${b} deve estar entre 0 e 10.`);
      return v;
    });
  }

  getSituacao() {
    const m = this.getMedia();
    if (m >= 7) return "Aprovado";
    if (m >= 5) return "Recuperação";
    return "Reprovado";
  }
}

/* ============ APRESENTAÇÃO ============
   Usa textContent: o nome nunca é interpretado como HTML. */
const $ = (id) => document.getElementById(id);
const fmt = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const IDS = ["nome", "n0", "n1", "n2", "n3"];

function mostrarForm(erro = null, valores = ["", "", "", "", ""], campoErro = null) {
  $("tela-resultado").hidden = true;
  $("tela-form").hidden = false;
  const caixa = $("erro");
  caixa.textContent = erro ?? "";
  caixa.hidden = !erro;
  IDS.forEach((id, i) => {
    $(id).value = valores[i];
    $(id).setAttribute("aria-invalid", String(id === campoErro));
  });
  if (campoErro) $(campoErro).focus();
}

function mostrarResultado(aluno) {
  const situacao = aluno.getSituacao();
  const classe = { "Aprovado": "aprovado", "Recuperação": "recuperacao" }[situacao] ?? "reprovado";
  $("r-nome").textContent = aluno.getNome();
  $("r-media").textContent = fmt(aluno.getMedia());
  const selo = $("r-situacao");
  selo.textContent = situacao;
  selo.className = "selo " + classe;
  const barras = $("r-barras");
  barras.replaceChildren();
  aluno.getNotas().forEach((n) => {
    const col = document.createElement("div"); col.className = "col";
    const rotulo = document.createElement("b"); rotulo.textContent = fmt(n);
    const barra = document.createElement("i"); barra.style.height = (n * 10) + "%";
    col.append(rotulo, barra);
    barras.append(col);
  });
  $("tela-form").hidden = true;
  $("tela-resultado").hidden = false;
}

/* ============ CONTROLE ============
   Recebe os dados, cria o Aluno, trata erros e escolhe a tela.
   Nada é salvo: os dados vivem só durante esta operação. */
function processar(valores) {
  try {
    mostrarResultado(new Aluno(valores[0], valores.slice(1)));
  } catch (e) {
    const m = e.message;
    const b = m.match(/(\d)º bimestre/);
    const campo = b ? "n" + (b[1] - 1) : "nome";
    mostrarForm(m, valores, campo);
  }
}

$("form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  processar(IDS.map((id) => $(id).value));
});

$("voltar").addEventListener("click", () => {
  mostrarForm();
  $("nome").focus();
});
</script>
</body>
</html>
